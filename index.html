<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AV STUDIO | Portal Manhwa Eksklusif</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 h-screen flex flex-col overflow-hidden">

    <!-- Header / Navbar AV Studio (Fixed di atas) -->
    <header class="border-b border-zinc-800/80 bg-zinc-900/90 backdrop-blur-md z-50 px-4 py-3 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-2">
            <span class="text-lg font-bold tracking-wider text-rose-500">AV STUDIO</span>
            <span class="text-[10px] bg-rose-500/10 text-rose-400 px-2 py-0.5 rounded-full border border-rose-500/20">Secure Gateway</span>
        </div>
        <div class="flex items-center space-x-2">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span class="text-xs text-zinc-400">Connected</span>
        </div>
    </header>

    <!-- Main Content Area: Melewati Vercel Proxy Gateway -->
    <main class="flex-1 w-full relative bg-zinc-900">
        <iframe 
            src="/api/proxy?url=https://komikhentai.cc/manhwa" 
            class="w-full h-full border-0" 
            title="AV Studio Secure Reader"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups">
        </iframe>
    </main>

</body>
</html>
